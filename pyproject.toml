[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coshui"
version = "0.1.0"
authors = [{name = "Jyle Frazier Villareal", email = "jylefraziervillareal@gmail.com"}]
description = "A Python-first — Declarative-Mode UI Library"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
pygame = ["pygame-ce"]
opengl = ["PyOpenGL", "PyOpenGL-accelerated"]

[tool.setuptools.packages.find]
where = ["src"]